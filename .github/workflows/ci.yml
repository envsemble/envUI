name: CI
on:
  push: {}
  pull_request: {}
permissions:
  contents: read
concurrency:
  group: envui-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Validate package and offline documentation
        run: npm run verify
      - name: Save offline reference
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: envui-reference
          path: dist/envUI.html
          if-no-files-found: error
      - name: Save browser failure traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-failure-traces
          path: test-results
          if-no-files-found: ignore
  betterleaks:
    name: Betterleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Betterleaks
        env:
          BETTERLEAKS_VERSION: '1.8.1'
          BETTERLEAKS_SHA256: 'efa407244e1ea8e35f582b8a42becdeac08bdead04f68eb752adda722d583c2a'
        run: |
          archive="$RUNNER_TEMP/betterleaks.tar.gz"
          curl -fsSL "https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}/betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz" -o "$archive"
          echo "${BETTERLEAKS_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/betterleaks" git . --redact
