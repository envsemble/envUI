name: CI
# One job for pull requests into dev and main once they are ready for review, on the Linux runner
# the envsemble organization variable CI_LINUX_RUNNER names. Pull requests into main are the
# releases: the full `npm run verify` runs for them in its own workflow (verify.yml), so this job
# only scans them with Betterleaks. Merging one publishes its version (release.yml).
on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  # The first step lists the pull request's files.
  pull-requests: read
defaults:
  run:
    shell: bash
# A new push cancels the run for the pull request's older head.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  ci:
    name: CI
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ${{ vars.CI_LINUX_RUNNER }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The whole history: Betterleaks scans it, and the contrast gate reads the base's
          # snapshot from the merge commit's first parent.
          fetch-depth: 0
          persist-credentials: false
      # The checks run for pull requests into dev. Most of envUI's Markdown is package content:
      # the README, docs/, the changesets and the skills ship in the package and render in the
      # catalogue, and the tests read them. Only the contributors' own guides are documentation, so a
      # pull request that changes only those runs Betterleaks alone. If listing the files fails, the
      # checks run.
      - name: Choose the checks
        id: changes
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.ref }}
          DOCUMENTATION: ^(CONTRIBUTING\.md|AGENTS\.md|CLAUDE\.md)$
        run: |
          if [ "$BASE" = main ]; then
            echo checks=false >> "$GITHUB_OUTPUT"
            echo "::notice title=Release pull request::The Verify workflow runs every check; this job scans with Betterleaks."
            exit 0
          fi
          # A renamed file counts by its old path too.
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$NUMBER/files?per_page=100" \
            --jq '.[] | .filename, (.previous_filename // empty)')
          if grep -qvE "$DOCUMENTATION" <<<"$files"; then
            echo checks=true >> "$GITHUB_OUTPUT"
          else
            echo checks=false >> "$GITHUB_OUTPUT"
            echo "::notice title=Documentation only::The checks are skipped; Betterleaks still runs."
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: ${{ steps.changes.outputs.checks != 'false' }}
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: ${{ steps.changes.outputs.checks != 'false' }}
      - name: Check generated icons, tokens and documentation
        if: ${{ steps.changes.outputs.checks != 'false' }}
        run: npm run icons:check && npm run tokens:check && npm run docs:check
      - name: Lint scripts, components and styles
        if: ${{ steps.changes.outputs.checks != 'false' }}
        run: npm run lint && npm run lint:css
      - name: Check formatting and TypeScript
        if: ${{ steps.changes.outputs.checks != 'false' }}
        run: npm run format:check && npm run typecheck
      - name: Build the package, the offline catalogue and the hosted catalogue
        if: ${{ steps.changes.outputs.checks != 'false' }}
        run: npm run build && npm run build:site
      - name: Test package contracts
        if: ${{ steps.changes.outputs.checks != 'false' }}
        run: npm test
      - name: Read the Playwright version
        id: playwright
        if: ${{ steps.changes.outputs.checks != 'false' }}
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Restore Chromium
        id: chromium
        if: ${{ steps.changes.outputs.checks != 'false' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        if: ${{ steps.changes.outputs.checks != 'false' && steps.chromium.outputs.cache-hit != 'true' }}
        run: npx playwright install --with-deps chromium
      - name: Install Chromium's system libraries
        if: ${{ steps.changes.outputs.checks != 'false' && steps.chromium.outputs.cache-hit == 'true' }}
        run: npx playwright install-deps chromium
      # The contrast gate also compares tests/contrast/DeclaredPairs.json with the base's copy
      # (tests/contrast/Snapshot.ts): the checkout is the pull request's merge commit, whose first
      # parent is the tip of the branch it merges into.
      - name: Test browser behavior in Chromium
        if: ${{ steps.changes.outputs.checks != 'false' }}
        run: ENVUI_CONTRAST_BASE="$(git rev-parse 'HEAD^1')" npx playwright test --project=chromium
      # Only a failure keeps anything: its traces and screenshots, for the organization's artifact
      # retention. A refused upload never fails the job.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ failure() }}
        continue-on-error: true
        with:
          name: browser-failure-${{ github.sha }}
          path: test-results
          if-no-files-found: ignore
      # Also after a failed check, so one run reports both.
      - name: Scan the history with Betterleaks
        if: ${{ !cancelled() }}
        env:
          BETTERLEAKS_VERSION: '1.8.1'
          BETTERLEAKS_SHA256: 'efa407244e1ea8e35f582b8a42becdeac08bdead04f68eb752adda722d583c2a'
        run: |
          archive="$RUNNER_TEMP/betterleaks.tar.gz"
          curl -fsSL "https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}/betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz" -o "$archive"
          echo "${BETTERLEAKS_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/betterleaks" git . --redact
