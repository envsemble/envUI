name: CI
# One job for pull requests into dev and main once they are ready for review, on the Linux runner
# the envsemble organization variable CI_LINUX_RUNNER names. Pull requests into main are the
# releases: the full `npm run verify` runs for them in its own workflow (verify.yml), so this job
# only scans them with Betterleaks. Merging one publishes its version (release.yml). There is no
# documentation-only skip: the README, docs/ and the changesets ship in the package, and
# Prettier and the tests read the contributors' guides too.
on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
defaults:
  run:
    shell: bash
# A new push cancels the run for the pull request's older head.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  ci:
    name: CI
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ${{ vars.CI_LINUX_RUNNER }}
    # The browser suite takes about 40 of these minutes on the two-core runner; 60 leaves room
    # without letting a hung run burn much more.
    timeout-minutes: 60
    env:
      # Two browser workers on a two-core runner; Playwright would take three where CI is set.
      ENVUI_WORKERS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The whole history: Betterleaks scans it, and the contrast gate reads the base's
          # snapshot from the merge commit's first parent.
          fetch-depth: 0
          persist-credentials: false
      # The checks run for pull requests into dev; a pull request into main gets them from Verify.
      - name: Choose the checks
        id: changes
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          if [ "$BASE" = main ]; then
            echo checks=false >> "$GITHUB_OUTPUT"
            echo "::notice title=Release pull request::The Verify workflow runs every check; this job scans with Betterleaks."
          else
            echo checks=true >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: ${{ steps.changes.outputs.checks != 'false' }}
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: ${{ steps.changes.outputs.checks != 'false' }}
      - name: Check generated icons, tokens and documentation
        if: ${{ steps.changes.outputs.checks != 'false' }}
        run: npm run icons:check && npm run tokens:check && npm run docs:check
      - name: Lint scripts, components and styles
        if: ${{ steps.changes.outputs.checks != 'false' }}
        run: npm run lint && npm run lint:css
      - name: Check formatting and TypeScript
        if: ${{ steps.changes.outputs.checks != 'false' }}
        run: npm run format:check && npm run typecheck
      - name: Build the package and the hosted site
        if: ${{ steps.changes.outputs.checks != 'false' }}
        run: npm run build && npm run build:site
      - name: Test package contracts
        if: ${{ steps.changes.outputs.checks != 'false' }}
        run: npm test
      - name: Read the Playwright version
        id: playwright
        if: ${{ steps.changes.outputs.checks != 'false' }}
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Restore Chromium
        id: chromium
        if: ${{ steps.changes.outputs.checks != 'false' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        if: ${{ steps.changes.outputs.checks != 'false' && steps.chromium.outputs.cache-hit != 'true' }}
        run: npx playwright install --with-deps chromium
      - name: Install Chromium's system libraries
        if: ${{ steps.changes.outputs.checks != 'false' && steps.chromium.outputs.cache-hit == 'true' }}
        run: npx playwright install-deps chromium
      # The contrast gate also compares tests/contrast/DeclaredPairs.json with the base's copy
      # (tests/contrast/Snapshot.ts): the checkout is the pull request's merge commit, whose first
      # parent is the tip of the branch it merges into.
      - name: Test browser behavior in Chromium
        if: ${{ steps.changes.outputs.checks != 'false' }}
        run: |
          # Only a base that has the snapshot: until it reaches dev and main, the gate compares with
          # the checkout's snapshot alone.
          if git cat-file -e 'HEAD^1:tests/contrast/DeclaredPairs.json' 2>/dev/null; then
            export ENVUI_CONTRAST_BASE="$(git rev-parse 'HEAD^1')"
          else
            echo "::notice::The base predates tests/contrast/DeclaredPairs.json, so the contrast gate compares with the checkout's snapshot alone."
          fi
          npx playwright test --project=chromium
      # Only a failure keeps anything: its traces and screenshots, for the organization's artifact
      # retention. A refused upload never fails the job.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ failure() }}
        continue-on-error: true
        with:
          name: browser-failure-${{ github.sha }}
          path: test-results
          if-no-files-found: ignore
      # Also after a failed check, so one run reports both.
      - name: Scan the history with Betterleaks
        if: ${{ !cancelled() }}
        env:
          BETTERLEAKS_VERSION: '1.8.1'
          BETTERLEAKS_SHA256: 'efa407244e1ea8e35f582b8a42becdeac08bdead04f68eb752adda722d583c2a'
        run: |
          archive="$RUNNER_TEMP/betterleaks.tar.gz"
          curl -fsSL "https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}/betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz" -o "$archive"
          echo "${BETTERLEAKS_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/betterleaks" git . --redact
