name: CI
on:
  # CI runs only for main (pull requests into it and pushes to it) while Actions minutes are
  # limited; changes reach dev after a local `npm run verify`. To run CI on dev again, add dev back
  # to both branch lists.
  #
  # There is no paths-ignore: Markdown is package content. The README, docs and skills ship in the
  # package and render in the catalogue, and Prettier, the product-name and documentation tests and
  # the catalogue's browser specs all read them, so a docs-only change can still break CI.
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # ready_for_review runs CI once a draft is marked ready; drafts themselves are skipped below.
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: envui-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: Checks
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check generated icons
        run: npm run icons:check
      - name: Check generated tokens
        run: npm run tokens:check
      - name: Check generated props
        run: npm run docs:check
      - name: Lint scripts and components
        run: npm run lint
      - name: Lint styles
        run: npm run lint:css
      - name: Check formatting
        run: npm run format:check
      - name: Check TypeScript
        run: npm run typecheck
      - name: Build package and offline catalogue
        run: npm run build
      - name: Test package contracts
        run: npm test
      - name: Save offline catalogue
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: envui-reference
          path: dist/envUI.html
          if-no-files-found: error
  browser:
    # Chromium only; Firefox and WebKit run in `npm run verify` before every release.
    name: Browser (Chromium)
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Two levels of history: the commit and its parents, one of which the contrast gate
          # compares with (below).
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Restore Chromium
        id: chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        if: steps.chromium.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium's system libraries
        if: steps.chromium.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      # The catalogue specs open the offline catalogue that the checks job built.
      - name: Fetch offline catalogue
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: envui-reference
          path: dist
      # The contrast gate also compares tests/contrast/DeclaredPairs.json with the base's copy
      # (tests/contrast/Snapshot.ts). A pull request's checkout is its merge commit, whose first
      # parent is the tip of the branch it merges into. A push's base is the commit it moved main
      # from, which the checkout holds when the push added one commit, as a merge or squash does; a
      # push that brought several commits, a force-push and a push that creates the branch skip the
      # comparison, which the pull request into main already made. A base from before the snapshot
      # existed is skipped too, and the gate then compares with the checkout's snapshot alone.
      - name: Find the contrast gate's base commit
        id: contrast-base
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          FORCED: ${{ github.event.forced }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            if ! git rev-parse --verify --quiet 'HEAD^2' >/dev/null; then
              echo "::error::The checkout isn't the pull request's merge commit, so it doesn't show the base the pull request merges into."
              exit 1
            fi
            base=$(git rev-parse 'HEAD^1')
          elif [ "$FORCED" = true ]; then
            echo "::notice::A force-push has no base, so the contrast gate compares with the checkout's snapshot alone."
            exit 0
          elif [ -z "${BEFORE//0/}" ]; then
            echo "::notice::A push that creates the branch has no base, so the contrast gate compares with the checkout's snapshot alone."
            exit 0
          elif ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "::notice::The push brought several commits, so the checkout lacks $BEFORE, which it moved main from; the contrast gate compares with the checkout's snapshot alone, as the pull request into main compared with its base."
            exit 0
          else
            base=$BEFORE
          fi
          if git cat-file -e "$base:tests/contrast/DeclaredPairs.json" 2>/dev/null; then
            echo "Comparing the contrast snapshot with $base."
            echo "sha=$base" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::The base, $base, predates tests/contrast/DeclaredPairs.json, so the contrast gate compares with the checkout's snapshot alone."
          fi
      # The hosted catalogue's specs need its build, which takes seconds and no network; without
      # it they fail here rather than skip.
      - name: Build hosted catalogue
        run: npm run build:site
      - name: Test browser behavior
        env:
          ENVUI_CONTRAST_BASE: ${{ steps.contrast-base.outputs.sha }}
        run: npx playwright test --project=chromium
      - name: Save browser results and failure diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-results
          path: test-results
          if-no-files-found: ignore
  betterleaks:
    name: Betterleaks
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Betterleaks
        env:
          BETTERLEAKS_VERSION: '1.8.1'
          BETTERLEAKS_SHA256: 'efa407244e1ea8e35f582b8a42becdeac08bdead04f68eb752adda722d583c2a'
        run: |
          archive="$RUNNER_TEMP/betterleaks.tar.gz"
          curl -fsSL "https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}/betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz" -o "$archive"
          echo "${BETTERLEAKS_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/betterleaks" git . --redact
