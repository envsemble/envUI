name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the tag on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::Release tags must point to a commit on main."; exit 1; }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - run: node scripts/ValidateRelease.mjs
      - run: node scripts/ValidateRelease.mjs --release-notes
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run verify
  publish:
    name: Publish packages and offline catalogue
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@envsemble'
      - run: npm ci
      - run: npm run build
      - name: Publish immutable packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$(node scripts/ValidateRelease.mjs --dist-tag)"
          npm publish --workspace @envsemble/envui --tag "$tag"
          npm publish --workspace @envsemble/envui-codemods --tag "$tag"
          npm publish --workspace @envsemble/eslint-plugin-envui --tag "$tag"
          npm publish --workspace @envsemble/stylelint-config-envui --tag "$tag"
      - name: Create matching release download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/ValidateRelease.mjs --release-notes > "$RUNNER_TEMP/release-notes.md"
          gh release create "$GITHUB_REF_NAME" dist/envUI.html --verify-tag --title "envUI $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md" $(node scripts/ValidateRelease.mjs --release-flag)
