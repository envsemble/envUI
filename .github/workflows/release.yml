name: Release
# Merging a pull request into main publishes its version when that version isn't released yet: the
# CI and Verify workflows already ran every check on the pull request, so this job only validates,
# builds and publishes. It creates a draft GitHub Release with the version's CHANGELOG section,
# publishes the three packages to npm under the version's dist-tag (latest, or the prerelease's
# name, such as prerelease), then publishes the release, which creates its tag on the merge commit.
# A failed run leaves the draft; re-running it publishes only what is still missing. It runs once
# per merge, on the Linux runner the envsemble organization variable CI_LINUX_RUNNER names.
on:
  pull_request:
    branches: [main]
    types: [closed]
permissions:
  # Creates and publishes the release and its tag.
  contents: write
  # npm's trusted publishing: npm takes the job's OpenID Connect token in place of a stored one.
  id-token: write
defaults:
  run:
    shell: bash
jobs:
  release:
    name: Release
    if: ${{ github.event.pull_request.merged }}
    runs-on: ${{ vars.CI_LINUX_RUNNER }}
    timeout-minutes: 20
    # One release at a time. The group names whether the pull request merged, so a pull request
    # closed without merging never queues among the releases or cancels one waiting its turn.
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.merged }}
      cancel-in-progress: false
    env:
      SHA: ${{ github.event.pull_request.merge_commit_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      # Without the dependencies' install scripts, which would run with the job's write token.
      - uses: ./.github/actions/setup
        with:
          registry-url: https://registry.npmjs.org
          install-scripts: 'false'
      # A version with a published release is done; otherwise the release must be ready
      # (scripts/release/ValidateRelease.ts) before it is built.
      - name: Choose the version
        id: version
        run: node scripts/release/Publish.ts --plan
      - run: npm run build
        if: ${{ steps.version.outputs.release == 'true' }}
      # Drafts the release, publishes the packages the registry lacks and publishes the release:
      # scripts/release/Publish.ts.
      - name: Publish the release
        if: ${{ steps.version.outputs.release == 'true' }}
        # No npm token: each package's trusted publisher on npmjs.com is this repository's
        # release.yml, and npm takes the job's identity in its place.
        run: node scripts/release/Publish.ts
