name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - run: node scripts/ValidateRelease.mjs
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run verify
  publish:
    name: Publish package and offline catalogue
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@envsemble'
      - run: npm ci
      - run: npm run build
      - name: Publish immutable package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish --workspace @envsemble/envui --tag "$(node scripts/ValidateRelease.mjs --dist-tag)"
      - name: Create matching release download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/envUI.html --verify-tag --title "envUI $GITHUB_REF_NAME" --notes-file packages/ui/CHANGELOG.md $(node scripts/ValidateRelease.mjs --release-flag)
