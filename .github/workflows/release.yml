name: Release
# Merging a pull request into main publishes its version when that version isn't released yet: the
# Verify workflow already ran every check on the pull request, so this job only validates, builds
# and publishes. It creates a draft GitHub Release with the version's CHANGELOG section and the
# offline catalogue, publishes the four packages under the version's dist-tag (latest, or the
# prerelease's name, such as prerelease), then publishes the release, which creates its tag on the
# merge commit. A failed run leaves the draft; re-running it publishes only what is still missing.
# It runs once per merge, on the Linux runner the envsemble organization variable CI_LINUX_RUNNER
# names.
on:
  pull_request:
    branches: [main]
    types: [closed]
permissions:
  # Creates and publishes the release and its tag.
  contents: write
  # Publishes the packages to GitHub Packages.
  packages: write
defaults:
  run:
    shell: bash
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  release:
    name: Release
    if: ${{ github.event.pull_request.merged }}
    runs-on: ${{ vars.CI_LINUX_RUNNER }}
    timeout-minutes: 20
    env:
      SHA: ${{ github.event.pull_request.merge_commit_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      # A version with a published release is done; a draft left by a failed run is finished.
      - name: Choose the version
        id: version
        run: |
          version=$(node -p "require('./packages/ui/package.json').version")
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "GITHUB_REF_NAME=$tag" >> "$GITHUB_ENV"
          if draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null) && [ "$draft" = false ]; then
            echo release=false >> "$GITHUB_OUTPUT"
            echo "::notice title=Nothing to release::$tag is already released."
          else
            echo release=true >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: ${{ steps.version.outputs.release == 'true' }}
        with:
          node-version: 24
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@envsemble'
      # The packages, the catalogue's dependency and the plugin manifests carry the version, and the
      # CHANGELOG has a section for it.
      - name: Validate the release
        if: ${{ steps.version.outputs.release == 'true' }}
        run: |
          node scripts/ValidateRelease.mjs
          node scripts/ValidateRelease.mjs --release-notes > "$RUNNER_TEMP/release-notes.md"
      - run: npm ci
        if: ${{ steps.version.outputs.release == 'true' }}
      - run: npm run build
        if: ${{ steps.version.outputs.release == 'true' }}
      - name: Draft the release
        if: ${{ steps.version.outputs.release == 'true' }}
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" dist/envUI.html --draft --target "$SHA" --title "envUI $TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" $(node scripts/ValidateRelease.mjs --release-flag)
      # The library first, then the codemods and the lint packages, as in CONTRIBUTING. A version
      # already on the registry, from an earlier attempt, is left as it is.
      - name: Publish the packages
        if: ${{ steps.version.outputs.release == 'true' }}
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          dist_tag="$(node scripts/ValidateRelease.mjs --dist-tag)"
          version="${GITHUB_REF_NAME#v}"
          for workspace in @envsemble/envui @envsemble/envui-codemods @envsemble/eslint-plugin-envui @envsemble/stylelint-config-envui; do
            if npm view "$workspace@$version" version >/dev/null 2>&1; then
              echo "$workspace@$version is already published."
            else
              npm publish --workspace "$workspace" --tag "$dist_tag"
            fi
          done
      - name: Publish the release
        if: ${{ steps.version.outputs.release == 'true' }}
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release edit "$TAG" --draft=false
