name: Verify
# The rest of `npm run verify` for pull requests into main (the releases) once they are ready for
# review: the library's @engines tests in Firefox and WebKit, the accessibility scan, the visual
# baseline in Docker and live development, as parallel jobs. CI runs the static checks, the build,
# the unit tests and Chromium on the same pull requests, in full, so the two required checks
# together are `npm run verify`. It is a workflow of its own so that pull requests into dev never
# report a Verify check, which an organization ruleset requires on envUI's main. The jobs run on
# the Linux runner the envsemble organization variable CI_LINUX_RUNNER names.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
# A new push cancels the run for the pull request's older head.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  # One browser worker per core; Playwright would take three where CI is set.
  ENVUI_WORKERS: '2'
jobs:
  # About 4 minutes in Firefox and 5 in WebKit, whose system libraries apt installs: no longer than
  # the visual baseline, so neither is sharded.
  engines:
    name: Library browser tests (${{ matrix.browser }})
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ${{ vars.CI_LINUX_RUNNER }}
    timeout-minutes: 15
    # WebKit runs one file at a time: two at once on the runner's two cores left a test past its
    # timeouts in most runs (a 2-CPU container failed 2 runs of 3 with two, none of 3 with one) for
    # about 5% more time. Firefox keeps two: one cost a fifth more and failed as often.
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: firefox
            workers: 2
          - browser: webkit
            workers: 1
    env:
      ENVUI_WORKERS: ${{ matrix.workers }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          browsers: ${{ matrix.browser }}
      - run: npm run -s test:library -- --browser=${{ matrix.browser }}
      # Only a failure keeps anything: its traces and screenshots, for the organization's artifact
      # retention. A refused upload never fails the job.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ failure() }}
        continue-on-error: true
        with:
          name: ${{ matrix.browser }}-failure-${{ github.sha }}
          path: test-results
          if-no-files-found: ignore

  # axe over every page of the hosted build.
  a11y:
    name: Accessibility
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ${{ vars.CI_LINUX_RUNNER }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          browsers: chromium-shell
      - run: npm run -s test:a11y
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ failure() }}
        continue-on-error: true
        with:
          name: a11y-failure-${{ github.sha }}
          path: test-results
          if-no-files-found: ignore

  # The screenshots, rendered in the pinned Playwright image (scripts/test/VisualTests.ts), which
  # installs the dependencies in its own volumes: the runner needs Node alone.
  visual:
    name: Visual baseline
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ${{ vars.CI_LINUX_RUNNER }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - run: node scripts/test/VisualTests.ts --reporter=dot
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ failure() }}
        continue-on-error: true
        with:
          name: visual-failure-${{ github.sha }}
          path: test-results
          if-no-files-found: ignore

  # The site's development server updating a component, a stylesheet, an export and a page as
  # they are edited.
  live:
    name: Live development
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ${{ vars.CI_LINUX_RUNNER }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          browsers: chromium-shell
      # The development server alone: the others would build the site and the fixture for nothing.
      - run: npx playwright test --project=live-development --no-deps
        env:
          ENVUI_SERVERS: site
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ failure() }}
        continue-on-error: true
        with:
          name: live-failure-${{ github.sha }}
          path: test-results
          if-no-files-found: ignore

  # The check the ruleset requires on main: it fails when any job above fails, is cancelled or is
  # skipped. Add every new job to `needs`.
  verify:
    name: Verify
    if: ${{ always() && !github.event.pull_request.draft }}
    needs: [engines, a11y, visual, live]
    runs-on: ${{ vars.CI_LINUX_RUNNER }}
    timeout-minutes: 5
    steps:
      - name: Require every job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(to_entries[]; .value.result == "success")' > /dev/null
