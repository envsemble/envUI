name: Verify
# The full `npm run verify` for pull requests into main (the releases) once they are ready for
# review: every check, the browser specs in Chromium, Firefox and WebKit, the accessibility scan,
# live development and the visual baseline in Docker. It is a workflow of its own so that pull
# requests into dev never report a Verify check, which an organization ruleset requires on envUI's
# main. The job runs on the Linux runner the envsemble organization variable CI_LINUX_RUNNER names.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
defaults:
  run:
    shell: bash
# A new push cancels the run for the pull request's older head.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verify:
    name: Verify
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ${{ vars.CI_LINUX_RUNNER }}
    timeout-minutes: 90
    env:
      # Two browser workers on a two-core runner; Playwright would take three where CI is set.
      ENVUI_WORKERS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Two levels: the merge commit and its parents, whose first is the tip of main, which the
          # contrast gate compares its snapshot with.
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Restore the browsers
        id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-all-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install the browsers
        if: ${{ steps.browsers.outputs.cache-hit != 'true' }}
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Install the browsers' system libraries
        if: ${{ steps.browsers.outputs.cache-hit == 'true' }}
        run: npx playwright install-deps chromium firefox webkit
      - name: Verify everything
        run: |
          # Only a base that has the snapshot: until it reaches dev and main, the gate compares with
          # the checkout's snapshot alone.
          if git cat-file -e 'HEAD^1:tests/contrast/DeclaredPairs.json' 2>/dev/null; then
            export ENVUI_CONTRAST_BASE="$(git rev-parse 'HEAD^1')"
          else
            echo "::notice::The base predates tests/contrast/DeclaredPairs.json, so the contrast gate compares with the checkout's snapshot alone."
          fi
          npm run verify
      # Only a failure keeps anything: its traces, screenshots and visual diffs, for the
      # organization's artifact retention. A refused upload never fails the job.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ failure() }}
        continue-on-error: true
        with:
          name: verify-failure-${{ github.sha }}
          path: test-results
          if-no-files-found: ignore
